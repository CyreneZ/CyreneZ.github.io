<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:description" content="edits, photos &amp; everything in between">
<meta property="og:url" content="https://cyrenez.github.io/">
<meta property="og:image" content="https://cyrenez.github.io/media/og.jpg">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 30'%3E%3Cg fill='%23B70F2D'%3E%3Cpath d='M20 11C15 6 8 1.5 3.5 3 .6 4 .6 9 1 12.5 1.5 16.5 3 19.5 6 19c4.5-.8 10-4 14-6z'/%3E%3Cpath d='M20 11c5-5 12-9.5 16.5-8 2.9 1 2.9 6 2.5 9.5-.5 4-2 7-5 6.5-4.5-.8-10-4-14-6z'/%3E%3Cpath d='M18.6 13.4c-2.1 4.1-5 8.6-8.2 12.2l4.6-.6 1.6 2.6c2.4-4.2 3.8-9 4.2-13.6z'/%3E%3Cpath d='M21.4 13.4c2.1 4.1 5 8.6 8.2 12.2l-4.6-.6-1.6 2.6c-2.4-4.2-3.8-9-4.2-13.6z'/%3E%3Crect x='17' y='8.6' width='6' height='6.8' rx='2.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Ms+Madi&family=Noto+Serif+Display:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bow" viewBox="0 0 40 30">
    <path d="M20 11C15 6 8 1.5 3.5 3 .6 4 .6 9 1 12.5 1.5 16.5 3 19.5 6 19c4.5-.8 10-4 14-6z"/>
    <path d="M20 11c5-5 12-9.5 16.5-8 2.9 1 2.9 6 2.5 9.5-.5 4-2 7-5 6.5-4.5-.8-10-4-14-6z"/>
    <path d="M18.6 13.4c-2.1 4.1-5 8.6-8.2 12.2l4.6-.6 1.6 2.6c2.4-4.2 3.8-9 4.2-13.6z"/>
    <path d="M21.4 13.4c2.1 4.1 5 8.6 8.2 12.2l-4.6-.6-1.6 2.6c-2.4-4.2-3.8-9-4.2-13.6z"/>
    <rect x="17" y="8.6" width="6" height="6.8" rx="2.4"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5zM16 9.5l5 5M21 9.5l-5 5"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 6 .4l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.1 1.1M14 10a4 4 0 0 0-6-.4l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.1-1.1"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h10v11H9zM15 9V4H5v11h4"/></symbol>
</svg>

<main>
  <section class="hero" id="intro">
    <h1 class="name" id="name">Cyrene</h1>
    <div class="side">
      <div class="intro">
        <p class="role" id="role"></p>
        <p class="tagline" id="tagline"></p>
      </div>
      <div class="dc" id="discord" hidden></div>
    </div>
    <div class="wave" id="wave" aria-label="latest posts">
      <span class="bar" style="--h:.52;--i:0"></span>
      <span class="bar" style="--h:.8;--i:1"></span>
      <span class="bar" style="--h:1;--i:2"></span>
      <span class="bar" style="--h:.68;--i:3"></span>
      <span class="bar" style="--h:.44;--i:4"></span>
      <span class="bar" style="--h:.62;--i:5"></span>
      <span class="bar" style="--h:.92;--i:6"></span>
      <span class="bar" style="--h:.58;--i:7"></span>
      <span class="bar" style="--h:.4;--i:8"></span>
    </div>
  </section>

  <section class="sec" id="edits">
    <header class="sec__head">
      <h2 class="sec__title">edits</h2>
      <p class="sec__meta" id="editsMeta"></p>
    </header>
    <div class="wall" id="editsWall"></div>
  </section>

  <section class="sec sec--blush" id="photos">
    <header class="sec__head">
      <h2 class="sec__title">photos</h2>
      <p class="sec__meta" id="photosMeta"></p>
    </header>
    <div class="wall" id="photosWall"></div>
  </section>

  <section class="about" id="about">
    <div class="about__pic" id="aboutPic"></div>
    <div class="about__body">
      <h2 class="about__title">a little about me</h2>
      <p class="about__text" id="aboutText"></p>
      <ul class="links" id="links"></ul>
      <p class="sign" id="sign"></p>
    </div>
  </section>
</main>

<nav class="tl" id="timeline" aria-label="sections" hidden>
  <div class="tl__track" id="track">
    <span class="tl__head" aria-hidden="true"><svg class="bow"><use href="#bow"/></svg></span>
  </div>
  <output class="tl__tc" id="timecode" aria-hidden="true">00:00:00</output>
</nav>

<dialog class="viewer" id="viewer" aria-label="viewer">
  <div class="v__bg" id="vBg"></div>
  <div class="v__stage" id="vStage" tabindex="-1">
    <video id="vVideo" playsinline loop></video>
    <img id="vImg" alt="">
    <div class="v__tools">
      <button class="v__btn" id="vClose" type="button" aria-label="close"><svg><use href="#i-close"/></svg></button>
      <span class="v__gap"></span>
      <button class="v__btn" id="vPrev" type="button" aria-label="previous"><svg><use href="#i-up"/></svg></button>
      <button class="v__btn" id="vNext" type="button" aria-label="next"><svg><use href="#i-down"/></svg></button>
      <button class="v__btn" id="vMute" type="button" aria-label="mute"><svg><use href="#i-sound"/></svg></button>
      <button class="v__btn" id="vShare" type="button" aria-label="copy link"><svg><use href="#i-link"/></svg></button>
    </div>
    <div class="v__foot">
      <div class="v__line">
        <span class="v__title" id="vTitle"></span>
        <span class="v__count" id="vCount"></span>
      </div>
      <div class="v__seek" id="vSeekWrap">
        <input class="v__range" id="vRange" type="range" min="0" max="1000" value="0" aria-label="seek">
        <span class="v__time" id="vTime">00:00</span>
      </div>
    </div>
  </div>
</dialog>

<p class="toast" id="toast" role="status"></p>

</body>
</html>
